name: platform-pki-service-issue
help: Issue a service certificate from PKI inventory
version: platform-pki-service-issue <%= ENV.fetch("PLATFORM_TOOLS_VERSION") %>

args:
- name: service
  help: Inventory service name
  required: true

flags:
- long: --namespace
  arg: path
  help: Platform namespace root
  validate: not_empty
- long: --pki-dir
  arg: path
  help: PKI directory
  validate: not_empty
- long: --days
  arg: days
  help: Service certificate lifetime
  validate: days
- long: --issuer-safety-days
  arg: days
  help: Required validity margin before the intermediate expires
  default: "1"
  validate: days
- long: --intermediate-pass-file
  arg: path
  help: Restricted file containing the encrypted intermediate-key passphrase
  validate: not_empty
- long: --rotate-key
  help: Archive and replace an existing service private key
- long: --csr-file
  arg: path
  help: Host-generated P-384 CSR
  validate: not_empty
- long: --request-file
  arg: path
  help: Canonical authenticated CSR request manifest
  validate: not_empty
- long: --request-signature
  arg: path
  help: Detached OpenSSH request signature
  validate: not_empty
- long: --approval-file
  arg: path
  help: Canonical offline approval manifest
  validate: not_empty
- long: --approval-signature
  arg: path
  help: Detached OpenSSH approval signature
  validate: not_empty
- long: --response-key
  arg: path
  help: Trusted Ed25519 response-signing private key
  validate: not_empty
- long: --current-cert-file
  arg: path
  help: Current host-local certificate (renewal only)
  validate: not_empty

examples:
- platform-pki-service-issue platform-example
- platform-pki-service-issue platform-example --intermediate-pass-file /run/secrets/platform-pki-intermediate-pass

footer: |-
  The namespace defaults to platform-infrastructure under the XDG
  configuration home. The PKI directory defaults to <namespace>/pki.
  The lifetime uses the inventory value, PLATFORM_PKI_SERVICE_DAYS, or 397
  days, in that order. Existing private keys are reused unless --rotate-key
  is used. Existing certificates are never overwritten; use
  platform-pki-service-renew after initial issuance. Passphrase files must be
  mode 600 or stricter and have a first line of at least 16 characters
  containing non-whitespace content.
  Host-local issue and migration require the complete authenticated CSR,
  request, approval, and response-signing inputs. They publish only a pending
  certificate candidate and signed response; managed migration state remains.
  Legacy singleton CA state must be migrated before this command can run.
