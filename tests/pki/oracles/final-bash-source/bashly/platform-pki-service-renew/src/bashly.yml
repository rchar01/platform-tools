name: platform-pki-service-renew
help: Renew a service certificate from PKI inventory
version: platform-pki-service-renew <%= ENV.fetch("PLATFORM_TOOLS_VERSION") %>

args:
- name: service
  help: Inventory service name
  required: true

flags:
- long: --namespace
  arg: path
  help: Platform namespace root
  validate: not_empty
- long: --pki-dir
  arg: path
  help: PKI directory
  validate: not_empty
- long: --days
  arg: days
  help: Service certificate lifetime
  validate: days
- long: --issuer-safety-days
  arg: days
  help: Required validity margin before the intermediate expires
  default: "1"
  validate: days
- long: --intermediate-pass-file
  arg: path
  help: Restricted file containing the encrypted intermediate-key passphrase
  validate: not_empty
- long: --rotate-key
  help: Archive and replace the existing service private key
- long: --csr-file
  arg: path
  help: Host-generated P-384 CSR
  validate: not_empty
- long: --request-file
  arg: path
  help: Canonical authenticated CSR request manifest
  validate: not_empty
- long: --request-signature
  arg: path
  help: Detached OpenSSH request signature
  validate: not_empty
- long: --approval-file
  arg: path
  help: Canonical offline approval manifest
  validate: not_empty
- long: --approval-signature
  arg: path
  help: Detached OpenSSH approval signature
  validate: not_empty
- long: --response-key
  arg: path
  help: Trusted Ed25519 response-signing private key
  validate: not_empty
- long: --current-cert-file
  arg: path
  help: Current host-local certificate bound by the request
  validate: not_empty

examples:
- platform-pki-service-renew platform-example
- platform-pki-service-renew platform-example --rotate-key

footer: |-
  The namespace defaults to platform-infrastructure under the XDG
  configuration home. The PKI directory defaults to <namespace>/pki.
  The lifetime uses the inventory value, PLATFORM_PKI_SERVICE_DAYS, or 397
  days, in that order. The existing private key is reused unless --rotate-key
  is used. Previous service state is archived only when renewal and verification
  complete successfully. Passphrase files must be mode 600 or stricter and have
  a first line of at least 16 characters containing non-whitespace content.
  Host-local renewal requires the complete authenticated CSR, current
  certificate, request, approval, and response-signing inputs. It publishes
  only a pending certificate candidate and signed response.
  Legacy singleton CA state must be migrated before this command can run.
